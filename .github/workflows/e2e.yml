name: E2E

# 端到端测试：Playwright TS（统一用 e2e/app.spec.ts + playwright.config.ts）
# 上一个版本同时跑了 Python e2e_tests.py 和 Playwright TS 重复且不一致
# 现统一为 Playwright TS；e2e_tests.py 仍保留供本地调试（不进 CI）
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  PORT: '4173'
  PLAYWRIGHT_PORT: '4173'

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-tests:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build preview bundle
        run: npm run build

      - name: Start preview server
        # `background: true` 让此步骤在后台运行，playwright 测试可继续访问端口
        run: npm run preview -- --port ${{ env.PORT }} --host 0.0.0.0
        background: true

      - name: Wait for preview server
        # 纯 bash 轮询（避免引入 wait-on 依赖）；最多等 60 秒
        run: |
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:${{ env.PORT }}; then
              echo "Preview server is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Preview server did not start within 60s"
          exit 1

      - name: Run Playwright tests
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:${{ env.PORT }}
          CI: true
        # 路由保护已通过 authedPage fixture 注入登录态解决；
        # 真实失败现在会 fail-fast，CI 全过则说明 e2e 真正可用
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test artifacts (traces/screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14
